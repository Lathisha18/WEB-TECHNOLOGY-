<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Registration Form</title><link rel="stylesheet" href="style.css"></head><body><main class="card"><p class="eyebrow">STUDENT SERVICES</p><h1>Workshop Registration</h1><p>Complete the form to register your interest.</p><form id="registrationForm"><label for="fullName">Full name</label><input id="fullName" name="fullName" type="text" placeholder="Enter your name" required minlength="2"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="name@example.com" required><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><label for="course">Area of interest</label><select id="course" name="course" required><option value="">Choose an area</option><option>Web Development</option><option>Artificial Intelligence</option><option>Cybersecurity</option></select><label for="date">Preferred date</label><input id="date" name="date" type="date" required><label for="message">Why are you interested?</label><textarea id="message" name="message" rows="4" placeholder="Write a short response"></textarea><label class="check"><input type="checkbox" required> I confirm that the details are correct.</label><div class="actions"><button type="submit">Submit Registration</button><button type="reset" class="secondary">Reset</button></div><p id="feedback" role="status"></p></form></main><script src="script.js"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshBite Ordering</title><link rel="stylesheet" href="style.css"></head><body><header><b>freshbite<span>.</span></b><p>Simple food ordering demo</p></header><main><section class="menu"><p class="eyebrow">TODAY'S MENU</p><h1>Build your order</h1><div class="item"><div><b>Garden Sandwich</b><small>Fresh vegetables · ₹90</small></div><button data-name="Garden Sandwich" data-price="90">Add</button></div><div class="item"><div><b>Paneer Wrap</b><small>Grilled paneer · ₹120</small></div><button data-name="Paneer Wrap" data-price="120">Add</button></div><div class="item"><div><b>Fruit Bowl</b><small>Seasonal fruits · ₹75</small></div><button data-name="Fruit Bowl" data-price="75">Add</button></div></section><section class="order"><h2>Your order</h2><ul id="cart"><li class="empty">No items added yet.</li></ul><div class="total"><span>Total</span><strong id="total">₹0</strong></div><form id="orderForm"><h2>Delivery details</h2><label for="customer">Name</label><input id="customer" required minlength="2" placeholder="Your name"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com"><label for="address">Delivery address</label><textarea id="address" required minlength="8" placeholder="Enter your address"></textarea><label for="payment">Payment method</label><select id="payment" required><option value="">Select payment</option><option>Cash on delivery</option><option>UPI (demo)</option></select><button class="submit" type="submit">Place order</button><p id="status" role="status"></p></form></section></main><script src="script.js"></script></body></html>

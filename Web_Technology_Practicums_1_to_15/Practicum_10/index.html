<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOM Playground</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>JAVASCRIPT PRACTICE</p><h1>DOM Playground</h1><span>Type a note, add it to the page, edit it or remove it.</span></header><section class="composer"><label for="noteInput">Your note</label><div><input id="noteInput" type="text" placeholder="e.g. Learn querySelector()" maxlength="90"><button id="addButton">Add note</button></div><small id="error" role="status"></small></section><section><div class="list-head"><h2>My notes</h2><span id="count">0 notes</span></div><ul id="notesList"><li class="empty">Your notes will appear here.</li></ul></section><button id="clearButton" class="clear">Clear all notes</button></main><script src="script.js"></script></body></html>

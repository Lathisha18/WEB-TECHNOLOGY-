<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Tracking Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><p>MY WORKSPACE</p><h1>Task Tracking Dashboard</h1><span>Plan small steps. Make steady progress.</span></header><main><section class="stats"><article><span>Total tasks</span><strong id="total">0</strong></article><article><span>Pending</span><strong id="pending">0</strong></article><article><span>Completed</span><strong id="completed">0</strong></article></section><section class="panel"><h2>Add a task</h2><div class="form"><input id="taskName" placeholder="Enter task name"><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><input id="dueDate" type="date"><button id="addTask">Add task</button></div><p id="message" role="status"></p></section><section class="panel"><div class="list-title"><h2>Task list</h2><button id="clear" class="light">Clear completed</button></div><div class="table-wrap"><table><thead><tr><th>Task</th><th>Priority</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead><tbody id="taskList"></tbody></table></div></section></main><script src="script.js"></script></body></html>
